<!-- TIME PERIOD SELECTION -->
<div id="screen-time" class="screen" style="display:block;">
    <h2>Choose a Time Period</h2>
    <button onclick="pickTime('artisanWorld')">Artisan World</button>
    <button onclick="pickTime('humanistWorld')">Humanist World</button>
    <button onclick="pickTime('engineeringWorld')">Military Engineering</button>
    <button onclick="pickTime('patronWorld')">Courtly Patronage</button>
</div>

<!-- CHARACTER SELECTION -->
<div id="screen-character" class="screen">
    <h2>Choose Your Character</h2>
    <div id="character-options"></div>
</div>

<!-- DECISION 1 -->
<div id="screen-d1" class="screen">
    <h2>Decision 1</h2>
    <p id="d1-text"></p>
    <button id="d1a" class="choice-btn" onclick="decision1('a')"></button>
    <button id="d1b" class="choice-btn" onclick="decision1('b')"></button>
</div>

<!-- DECISION 2 -->
<div id="screen-d2" class="screen">
    <h2>Decision 2</h2>
    <p id="d2-text"></p>
    <button id="d2a" class="choice-btn" onclick="decision2('a')"></button>
    <button id="d2b" class="choice-btn" onclick="decision2('b')"></button>
</div>

<!-- DECISION 3 -->
<div id="screen-d3" class="screen">
    <h2>Decision 3</h2>
    <p id="d3-text"></p>
    <button id="d3a" class="choice-btn" onclick="decision3('a')"></button>
    <button id="d3b" class="choice-btn" onclick="decision3('b')"></button>
</div>

<!-- ENDING -->
<div id="screen-end" class="screen">
    <h2>Your Journey's Lesson</h2>
    <p id="ending-text"></p>
    <button onclick="restart()">Play Again</button>
</div>

<script>
let currentPeriod = "";
let currentCharacter = "";
let path1 = "";
let path2 = "";

function show(screen) {
    document.querySelectorAll(".screen").forEach(s => s.style.display = "none");
    document.getElementById(screen).style.display = "block";
}

function pickTime(period) {
    currentPeriod = period;
    let html = "";

    for (let key in data[period]) {
        html += `<button onclick="pickCharacter('${key}')">${data[period][key].characterName}</button>`;
    }

    document.getElementById("character-options").innerHTML = html;
    show("screen-character");
}

function pickCharacter(key) {
    currentCharacter = key;
    const d1 = data[currentPeriod][currentCharacter].d1;

    document.getElementById("d1-text").innerText = d1.text;
    document.getElementById("d1a").innerText = d1.choiceA;
    document.getElementById("d1b").innerText = d1.choiceB;

    show("screen-d1");
}

function decision1(choice) {
    path1 = choice;
    const branches = data[currentPeriod][currentCharacter].d2;

    const next = (choice === "a") ? branches.fromA : branches.fromB;

    document.getElementById("d2-text").innerText = next.text;
    document.getElementById("d2a").innerText = next.choiceA;
    document.getElementById("d2b").innerText = next.choiceB;

    show("screen-d2");
}

function decision2(choice) {
    path2 = choice;
    const branches = data[currentPeriod][currentCharacter].d3;

    const next = (path1 === "a")
        ? branches.fromA[choice]
        : branches.fromB[choice];

    document.getElementById("d3-text").innerText = next.text;
    document.getElementById("d3a").innerText = next.choiceA;
    document.getElementById("d3b").innerText = next.choiceB;

    show("screen-d3");
}

function decision3(choice) {
    const end = data[currentPeriod][currentCharacter].ending;
    document.getElementById("ending-text").innerText = end;
    show("screen-end");
}

function restart() {
    show("screen-time");
}
